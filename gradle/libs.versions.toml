[versions]
asm = "9.11.1"
error-prone = "2.53.0"
requirements = "11.0"
gradle = "9.9.2"
jspecify = "1.0.1"
nullaway = "0.14.4"
spring-boot = "4.2.0"

# Gradle plugins
error-prone-plugin = "5.2.0"
versions-plugin = "0.67.0"

[plugins]
error-prone = { id = "net.ltgt.errorprone", version.ref = "error-prone-plugin" }
versions = { id = "io.github.ben-manes.versions", version.ref = "versions-plugin" }

[libraries]
# BOM — provides versions for slf4j, logback, junit, assertj
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

error-prone = { module = "com.google.errorprone:error_prone_core", version.ref = "error-prone" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }

# Not managed by Spring Boot BOM
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-analysis = { module = "org.ow2.asm:asm-analysis", version.ref = "asm" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
asm-util = { module = "org.ow2.asm:asm-util", version.ref = "asm" }
requirements = { module = "com.github.cowwoc.requirements:java", version.ref = "requirements" }
